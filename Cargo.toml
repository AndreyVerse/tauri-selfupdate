[package]
name = "tauri-selfupdate"
version = "3.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Self-update for portable Windows apps from GitHub or GitVerse releases, with minisign signatures and rollback"
repository = "https://github.com/AndreyVerse/tauri-selfupdate"
readme = "README.md"

[dependencies]
# native-tls: на Windows это SChannel и системное хранилище сертификатов — корпоративные
# прокси с подменой TLS работают так же, как в браузере.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
base64 = "0.22"
# Только deflate: релизный архив пишет Compress-Archive, другие методы не нужны.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
